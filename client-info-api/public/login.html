<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("ewe-ticket-theme");
        } catch {}
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Вхід | DUMA Client Info</title>
    <link rel="icon" href="/duma-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=20260715-compact-console">
    <script src="/login.js?v=20260715-compact-console" defer></script>
  </head>
  <body class="login-body">
    <a class="skip-link" href="#main-content">Перейти до форми входу</a>
    <main class="login-page" id="main-content">
      <section class="login-card" aria-label="Авторизація">
        <div class="login-card-top">
          <a class="login-brand" href="/client-card" aria-label="DUMA">
            <img src="/duma-logo.svg" alt="DUMA">
          </a>
          <button class="theme-toggle login-theme-toggle" id="theme-toggle" type="button" data-theme-toggle aria-label="Перемкнути тему">
            <span class="theme-toggle-option is-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
              </svg>
            </span>
            <span class="theme-toggle-option is-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
              </svg>
            </span>
          </button>
        </div>

        <p class="section-label">DUMA Client Info</p>
        <h1>Вхід у систему</h1>
        <p class="login-muted">Увійдіть, щоб працювати з карткою клієнта, дзвінками та AI-аналітикою.</p>

        <form class="login-form" id="login-form">
          <label>
            <span>Логін</span>
            <input id="login-username" name="username" type="text" autocomplete="username" required autofocus>
          </label>
          <label>
            <span>Пароль</span>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">Увійти</button>
          <p class="form-message" id="login-message" role="alert"></p>
        </form>
      </section>
    </main>
  </body>
</html>
